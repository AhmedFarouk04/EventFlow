      --startup-project src/Modules/Reservations/API/API.csproj
      --context EventDrivenBookingPlatform.Modules.Audit.Infrastructure.Persistence.AuditDbContext"
    environment:
      ConnectionStrings__Reservations: Server=sqlserver,1433;Database=EventDrivenBookingDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      ConnectionStrings__Availability: Server=sqlserver,1433;Database=EventDrivenBookingAvailabilityDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      ConnectionStrings__Audit: Server=sqlserver,1433;Database=EventDrivenBookingAuditDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      ConnectionStrings__Pricing: Server=sqlserver,1433;Database=EventDrivenBookingPricingDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      ConnectionStrings__Notifications: Server=sqlserver,1433;Database=EventDrivenBookingNotificationsDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      ConnectionStrings__Users: Server=sqlserver,1433;Database=EventDrivenBookingUsersDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
